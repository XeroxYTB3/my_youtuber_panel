name: reminders
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('data.json')) return;
            const d = JSON.parse(fs.readFileSync('data.json', 'utf8'));
            const limit = Date.now() + 864e5;
            let changed = false;
            for (const e of d.events) {
              if (e.done || e.notified || !e.assignee || new Date(e.date) > limit) continue;
              const when = new Date(e.date).toLocaleString('fr-FR', { timeZone: 'Europe/Paris' });
              await github.rest.issues.create({
                ...context.repo,
                title: `⏰ ${e.title}`,
                body: `@${e.assignee} rappel (${e.type}) : prévu le ${when}`
              });
              e.notified = true;
              changed = true;
            }
            if (changed) {
              fs.writeFileSync('data.json', JSON.stringify(d, null, 1));
              const { execSync } = require('child_process');
              execSync('git config user.name "reminder-bot" && git config user.email "bot@users.noreply.github.com" && git commit -am "rappels" && git push');
            }
